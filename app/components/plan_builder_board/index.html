<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--text);font-family:var(--font);overflow:hidden}
#board{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,36px);gap:3px;width:100%}
.day{display:grid;grid-template-columns:4.2rem minmax(0,1fr);align-items:center;gap:4px;padding:3px;border:1px solid var(--border);border-radius:5px;background:transparent;min-width:0}
.day.past{opacity:.5;pointer-events:none}.date{font-size:10px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sessions{display:flex;gap:3px;min-width:0;height:28px;align-items:center}.session{position:relative;flex:1;min-width:0;height:26px;padding:5px 22px 5px 8px;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:4px;background:var(--secondary);color:var(--text);font-family:var(--font);font-size:10px;font-weight:650;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.session:hover{border-color:var(--muted)}.day.empty{cursor:pointer}.day.empty:hover{border-color:var(--muted)}
.menu{position:absolute;right:3px;top:3px;width:20px;height:20px;border:0;background:transparent;color:inherit;cursor:pointer;padding:0;font-size:15px}
#popover{position:fixed;z-index:20;min-width:220px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--background);box-shadow:0 5px 24px rgba(0,0,0,.2)}
#popover[hidden],#editor[hidden]{display:none}.actions{display:flex;gap:5px}.actions button,.templates button{border:1px solid var(--border);background:var(--secondary);color:var(--text);border-radius:5px;padding:6px 9px;cursor:pointer;font-family:var(--font)}
.templates{display:flex;flex-wrap:wrap;gap:5px}.templates button{border-left:4px solid var(--accent)}
#editor{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:grid;place-items:center}
.panel{width:min(760px,94vw);max-height:88vh;overflow:auto;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--background)}
.panel h3{margin:0 0 10px}.editor-section{margin:0 0 9px;padding:10px;border:1px solid var(--border);border-radius:7px}.editor-section legend{padding:0 5px;font-size:12px;font-weight:700}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wide{grid-column:1/-1}label{display:grid;gap:3px;font-size:11px;font-weight:650}input,textarea,select{width:100%;padding:7px;border:1px solid var(--border);border-radius:5px;background:var(--secondary);color:var(--text);font-family:var(--font)}textarea{min-height:62px}.impact{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.metric{padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--secondary)}.metric span{display:block;font-size:9px;opacity:.7}.metric strong{font-size:13px}.recommendation{grid-column:1/-1;padding:9px;border-left:4px solid var(--impact);border-radius:4px;background:color-mix(in srgb,var(--impact) 12%,transparent);font-size:11px;line-height:1.35}.footer{display:flex;justify-content:flex-end;gap:7px;margin-top:10px}.footer button{padding:7px 14px;border:1px solid var(--border);border-radius:5px;background:var(--secondary);color:var(--text);cursor:pointer;font-family:var(--font)}
</style>
</head>
<body>
<div id="board"></div><div id="popover" hidden></div>
<div id="editor" hidden><form class="panel" id="form"><h3 id="editor-title">Edit session</h3>
<fieldset class="editor-section"><legend>Essentials</legend><div class="fields">
<label>Session type<input name="title" required></label><label>Duration (min)<input name="duration" type="number" min="0"></label><label>Distance (km)<input name="distance" type="number" min="0" step=".1"></label><label>Elevation gain (m)<input name="elevation" type="number" min="0" step="1"></label><label class="wide">Main objective<input name="objective"></label>
</div></fieldset>
<fieldset class="editor-section"><legend>Intensity</legend><div class="fields"><label>Effort<select name="intensity"><option value="very easy">Very easy</option><option value="easy">Easy</option><option value="easy to moderate">Easy to moderate</option><option value="moderately hard">Moderately hard</option><option value="hard">Hard</option><option value="very hard">Very hard</option><option value="race effort">Race effort</option></select></label><label>Target method<select name="target_method"><option>Zone</option><option>Heart rate</option><option>Pace</option><option>RPE</option></select></label><label>Target value<input name="target_value" placeholder="e.g. Z3, 155–165 bpm or 5:00/km"></label></div></fieldset>
<details class="editor-section"><summary>Session structure</summary><div class="fields"><label class="wide">Prescription<input name="prescription"></label><label class="wide">Steps (one per line)<textarea name="structure"></textarea></label></div></details>
<fieldset class="editor-section"><legend>Estimated physiological impact</legend><div class="impact"><div class="metric"><span>Current load</span><strong id="old-load">—</strong></div><div class="metric"><span>New load</span><strong id="new-load">—</strong></div><div class="metric"><span>Difference</span><strong id="load-difference">—</strong></div><div class="recommendation" id="recommendation">Change the session to see its estimated impact.</div></div></fieldset>
<div class="footer"><button type="button" id="close">Cancel</button><button type="submit">Apply changes</button></div></form></div>
<script>
let args={days:[],workouts:[],templates:[]}, selected=null, editMode="edit", targetDay=null, ignoreNextRender=false;
const board=document.querySelector("#board"), pop=document.querySelector("#popover"), editor=document.querySelector("#editor"), form=document.querySelector("#form");
const colors=t=>{const s=(t||"").toLowerCase();if(s.includes("race")||s.includes("pre-race"))return"#e34b70";if(s.includes("tempo")||s.includes("lt2")||s.includes("threshold")||s.includes("interval"))return"#e8ac22";if(s.includes("hill"))return"#23864b";if(s.includes("long"))return"#8a55d7";if(s.includes("easy")||s.includes("recovery")||s.includes("shakeout"))return"#73cf91";return"#8b96a5"};
function send(value){ignoreNextRender=true;window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:{...value,nonce:Date.now()+"-"+Math.random()}},"*")}
function height(){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:board.scrollHeight+4},"*")}
function expandEditorFrame(){const frame=window.frameElement;if(!frame)return;frame.dataset.planBuilderStyle=frame.getAttribute("style")||"";Object.assign(frame.style,{position:"fixed",inset:"0",width:"100vw",height:"100vh",zIndex:"999999",border:"0",background:"transparent"})}
function collapseEditorFrame(){const frame=window.frameElement;if(!frame)return;frame.setAttribute("style",frame.dataset.planBuilderStyle||"");height()}
function closePopover(){pop.hidden=true}
function handleParentPointer(){closePopover()}
function handleEscape(event){if(event.key!=="Escape")return;if(!editor.hidden){editor.hidden=true;collapseEditorFrame()}closePopover()}
function bindDismissHandlers(){window.setTimeout(()=>window.parent.document.addEventListener("pointerdown",handleParentPointer,{once:true}),0)}
function intensityRpe(value){return {"very easy":2,"easy":3,"easy to moderate":4,"moderately hard":6,"hard":7,"race effort":8,"very hard":9}[String(value||"").toLowerCase()]||4}
function estimateLoad(){const values=Object.fromEntries(new FormData(form).entries());const minutes=Number(values.duration)||0;const elevation=Math.max(0,Number(values.elevation)||0);return Math.round(minutes*intensityRpe(values.intensity)*(1+Math.min(elevation/100*0.05,.30)))}
function isDemanding(workout){const value=((workout?.title||"")+" "+(workout?.intensity||"")).toLowerCase();return ["tempo","threshold","lt2","hill","interval","hard","race"].some(token=>value.includes(token))}
function analyseImpact(){if(!selected)return;const oldLoad=editMode==="add"?0:Math.round(Number(selected.load)||0);const newLoad=estimateLoad();const difference=newLoad-oldLoad;const edited={...selected,title:form.elements.title.value,intensity:form.elements.intensity.value,day:targetDay};const nearby=args.workouts.filter(w=>w.id!==selected.id&&isDemanding(w)&&Math.abs((new Date(w.day)-new Date(targetDay))/86400000)<2);let level="recommended",colour="#21a366",message="This change keeps the planned stimulus and recovery spacing balanced.";if(isDemanding(edited)&&nearby.length){level="attention";colour="#e0a100";message="A demanding session is less than 48 hours away. Consider reducing this session or moving one of them."}if(oldLoad>0&&difference/oldLoad>.25){level="high impact";colour="#df4b5f";message="Load rises by more than 25%. Reduce duration or intensity, or allow extra recovery before the next demanding session."}else if(oldLoad>0&&difference/oldLoad<-.25){level="reduced stimulus";colour="#e0a100";message="Load falls by more than 25%. Check that the session still supports the objective of this training phase."}else if(editMode==="add"&&isDemanding(edited)&&nearby.length){level="high impact";colour="#df4b5f";message="Adding this demanding session leaves less than 48 hours of recovery. Choose another day or reduce its intensity."}document.querySelector("#old-load").textContent=oldLoad?oldLoad+" AU":"0 AU";document.querySelector("#new-load").textContent=newLoad?newLoad+" AU":"—";document.querySelector("#load-difference").textContent=(difference>0?"+":"")+difference+" AU";const recommendation=document.querySelector("#recommendation");recommendation.style.setProperty("--impact",colour);recommendation.innerHTML="<strong>"+level.charAt(0).toUpperCase()+level.slice(1)+".</strong> "+message}
function openEditor(workout,mode,day){selected=workout;editMode=mode;targetDay=day;document.querySelector("#editor-title").textContent=mode==="add"?"Add session":"Edit session";for(const key of ["title","duration","distance","elevation","intensity","objective","prescription","structure"])form.elements[key].value=workout?.[key]??"";form.elements.target_method.value="Zone";form.elements.target_value.value="";expandEditorFrame();editor.hidden=false;pop.hidden=true;analyseImpact()}
function openMenu(event,w){event.stopPropagation();selected=w;const r=event.currentTarget.getBoundingClientRect();pop.style.left=Math.min(r.left,innerWidth-230)+"px";pop.style.top=Math.min(r.bottom+4,innerHeight-60)+"px";pop.innerHTML='<div class="actions"><button data-a="add" title="Add session">＋</button><button data-a="edit" title="Edit session">✎</button><button data-a="delete" title="Remove session">🗑</button></div>';pop.hidden=false;bindDismissHandlers();pop.querySelector('[data-a="add"]').onclick=()=>openTemplates(w.day);pop.querySelector('[data-a="edit"]').onclick=()=>openEditor(w,"edit",w.day);pop.querySelector('[data-a="delete"]').onclick=()=>{args.workouts=args.workouts.filter(item=>item.id!==w.id);render();send({action:"delete",workout_id:w.id})}}
function openTemplates(day){targetDay=day;pop.innerHTML='<div class="templates"></div>';const box=pop.firstChild;args.templates.forEach(t=>{const b=document.createElement("button");b.textContent=t.title;b.style.setProperty("--accent",colors(t.title));b.onclick=()=>openEditor(t,"add",day);box.appendChild(b)});pop.hidden=false;bindDismissHandlers()}
function render(){board.innerHTML="";const weeks=Math.ceil(args.days.length/7);board.style.gridTemplateColumns=`repeat(${weeks},minmax(0,1fr))`;args.days.forEach(d=>{const cell=document.createElement("div");cell.className="day"+(d.past?" past":"");const items=args.workouts.filter(w=>w.day===d.day);if(!items.length)cell.classList.add("empty");cell.innerHTML='<span class="date">'+d.label+'</span><div class="sessions"></div>';cell.onclick=()=>{if(!d.past&&!items.length){const r=cell.getBoundingClientRect();pop.style.left=Math.min(r.left,innerWidth-230)+"px";pop.style.top=Math.min(r.bottom+4,innerHeight-100)+"px";openTemplates(d.day)}};cell.ondragover=e=>{if(!d.past)e.preventDefault()};cell.ondrop=e=>{e.preventDefault();const workoutId=e.dataTransfer.getData("text/plain");const moved=args.workouts.find(w=>w.id===workoutId);if(moved)moved.day=d.day;render();send({action:"move",workout_id:workoutId,target_day:d.day})};const sessions=cell.querySelector(".sessions");items.forEach(w=>{const item=document.createElement("div");item.className="session";item.draggable=!d.past&&!w.race&&!w.completed;item.style.setProperty("--accent",colors(w.title));item.textContent=w.title;item.ondragstart=e=>e.dataTransfer.setData("text/plain",w.id);if(!d.past&&!w.completed){const menu=document.createElement("button");menu.className="menu";menu.textContent="⋯";menu.onclick=e=>openMenu(e,w);item.appendChild(menu)}sessions.appendChild(item)});board.appendChild(cell)});height()}
form.addEventListener("input",analyseImpact);form.addEventListener("change",analyseImpact);
form.onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(form).entries());if(editMode==="add"){args.workouts.push({...selected,...values,id:"pending-"+Date.now(),day:targetDay,load:estimateLoad(),completed:false,race:false});render();send({action:"add",template:selected.title,target_day:targetDay,values})}else{const changed=args.workouts.find(item=>item.id===selected.id);if(changed)Object.assign(changed,values,{load:estimateLoad()});render();send({action:"edit",workout_id:selected.id,values})}editor.hidden=true;collapseEditorFrame()};
document.querySelector("#close").onclick=()=>{editor.hidden=true;collapseEditorFrame()};document.addEventListener("click",e=>{if(!pop.hidden&&!pop.contains(e.target)&&!e.target.closest(".menu")&&!e.target.closest(".day.empty"))closePopover()});document.addEventListener("keydown",handleEscape);window.parent.document.addEventListener("keydown",handleEscape);
window.addEventListener("beforeunload",()=>window.parent.document.removeEventListener("keydown",handleEscape));
window.addEventListener("message",event=>{if(event.data?.type!=="streamlit:render")return;if(ignoreNextRender){ignoreNextRender=false}else{args=event.data.args}const theme=event.data.theme||{};const root=document.documentElement.style;root.setProperty("--text",theme.textColor||"#31333f");root.setProperty("--background",theme.backgroundColor||"#fff");root.setProperty("--secondary",theme.secondaryBackgroundColor||"#f0f2f6");root.setProperty("--border",theme.borderColor||"color-mix(in srgb,var(--text) 25%,transparent)");root.setProperty("--muted","color-mix(in srgb,var(--text) 55%,transparent)");root.setProperty("--font",theme.font||'"Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif');render()});
window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");
</script>
</body>
</html>
