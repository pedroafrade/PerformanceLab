name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Check Python syntax
        run: python -m compileall -q app performancelab migrations

      - name: Run tests
        run: pytest -q

  container:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag performancelab-alpha:ci .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name performancelab-alpha-ci \
            --publish 8080:8080 \
            --env PERFORMANCELAB_ENV=local \
            performancelab-alpha:ci

      - name: Verify Streamlit health
        run: |
          curl \
            --fail \
            --retry 15 \
            --retry-delay 2 \
            --retry-connrefused \
            --retry-all-errors \
            http://127.0.0.1:8080/_stcore/health

      - name: Reject incomplete alpha configuration
        run: |
          alpha_log="${RUNNER_TEMP}/alpha-preflight.log"

          if docker run \
            --rm \
            --env PERFORMANCELAB_ENV=alpha \
            performancelab-alpha:ci \
            > "${alpha_log}" \
            2>&1
          then
            echo \
              "Container unexpectedly accepted incomplete alpha configuration." \
              >&2
            exit 1
          fi

          grep \
            --fixed-strings \
            --quiet \
            "Alpha runtime configuration is incomplete or invalid." \
            "${alpha_log}"

      - name: Reject missing alpha authentication configuration
        run: |
          alpha_env="${RUNNER_TEMP}/complete-alpha.env"
          auth_log="${RUNNER_TEMP}/alpha-auth-preflight.log"

          {
            echo "PERFORMANCELAB_ENV=alpha"
            echo "DATABASE_URL=postgresql+psycopg://ci_user@db.invalid/performancelab"
            echo "PRIVACY_CONTACT_EMAIL=privacy@example.invalid"
            echo "RETENTION_INACTIVE_ACCOUNT_DAYS=90"
            echo "RETENTION_INACTIVITY_NOTICE_DAYS=14"
            echo "RETENTION_TRAINING_COACH_USAGE_DAYS=30"
            echo "RETENTION_CONSENT_EVIDENCE_DAYS=0"
            echo "RETENTION_UNUSED_INVITATION_DAYS=14"
            echo "RETENTION_EXPIRED_INVITATION_DAYS=7"
            echo "RETENTION_APPLICATION_LOG_DAYS=14"
            echo "RETENTION_ERROR_ALERT_DAYS=30"
            echo "RETENTION_BACKUP_DAYS=14"
            echo "RETENTION_SUPPORT_REQUEST_DAYS=90"
            echo "RETENTION_POST_ALPHA_DAYS=30"
          } > "${alpha_env}"

          if docker run \
            --rm \
            --env-file "${alpha_env}" \
            performancelab-alpha:ci \
            > "${auth_log}" \
            2>&1
          then
            echo \
              "Container unexpectedly started without OIDC configuration." \
              >&2
            exit 1
          fi

          grep \
            --fixed-strings \
            --quiet \
            "Alpha authentication configuration is incomplete or invalid." \
            "${auth_log}"

      - name: Validate mounted authentication example
        run: |
          auth_success_log="${RUNNER_TEMP}/alpha-auth-success.log"

          docker run \
            --rm \
            --mount \
            "type=bind,source=${GITHUB_WORKSPACE}/.streamlit/secrets.toml.example,target=/app/.streamlit/secrets.toml,readonly" \
            --entrypoint python \
            performancelab-alpha:ci \
            scripts/check_alpha_auth_configuration.py \
            > "${auth_success_log}" \
            2>&1

          grep \
            --fixed-strings \
            --quiet \
            "Alpha authentication configuration is structurally valid." \
            "${auth_success_log}"

      - name: Stop container
        if: always()
        run: docker rm --force performancelab-alpha-ci