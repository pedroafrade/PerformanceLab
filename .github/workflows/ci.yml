name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Check Python syntax
        run: python -m compileall -q app performancelab migrations

      - name: Run tests
        run: pytest -q

  container:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag performancelab-alpha:ci .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name performancelab-alpha-ci \
            --publish 8080:8080 \
            --env PERFORMANCELAB_ENV=local \
            performancelab-alpha:ci

      - name: Verify Streamlit health
        run: |
          curl \
            --fail \
            --retry 15 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:8080/_stcore/health

      - name: Stop container
        if: always()
        run: docker rm --force performancelab-alpha-ci